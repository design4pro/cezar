# `steps` form rather than the `skills:` shorthand, because the shorthand runs with
# DEFAULT_ALLOWED_TOOLS, which has no `Agent`: the skill settles open questions through an
# independent specialist sub-agent (.ai/skills/afk-decide/SKILL.md, SDLC.md § Delegated decisions).
name: architecture-review
description: Find deepening opportunities in recent hot spots and file at most three refactor issues (afk-architecture-review).
steps:
  - id: afk-architecture-review
    name: afk-architecture-review
    skill: afk-architecture-review
    prompt: '{{task}}'
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Agent]
